name: check-pr
on:
  push:
    branches:
    - 'master'
  pull_request: {}
jobs:
  check-pr:
    name: check-pr
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@01aecccf739ca6ff86c0539fbc67a7a5007bbc81 # v2.1.0
    - name: Set up Node.js
      uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
      with:
        node-version: 16.17.0
    - run: npm install
    - run: npm run asbuild
    # make sure example filter builds:
    - run: cd examples/auth && npm install && npm run asbuild
    - run: cd examples/addheader && npm install && npm run asbuild